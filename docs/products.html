<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Glimmer Products</title>

<link
rel="stylesheet"
href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

</head>

<body>

<!-- HEADER -->

 <!-- HEADER -->
    <header>
        <div class="logo-section">
            <img src="assets/logo1.png" alt="Glimmer Logo">
        </div>

        <nav class="navbar">
            <a href="index.html">Home</a>

            <div class="dropdown">
                <button class="dropbtn">Products ▼</button>

                <div class="dropdown-content">
                    <a href="products.html?category=all">All</a>
                    <a href="products.html?category=earrings">Earrings</a>
                    <a href="products.html?category=necklace">Necklace & Chains</a>
                    <a href="products.html?category=bracelets">Bracelets</a>
                    <a href="products.html?category=rings">Rings</a>
                </div>
            </div>

            <a href="contact.html">Contact</a>
            <a href="admin.html">Admin</a>
            <a href="myCart.html">🛒 My Cart</a>
        </nav>
    </header>

<!-- HERO -->

<section class="collection-section">

    <h5 class="collection-label">
        DISCOVER ELEGANCE IN EVERY PIECE
    </h5>

    <h1 class="collection-title" id="categoryTitle">
        Glimmer Collection
    </h1>

</section>

<!-- CATEGORY FILTERS -->

<section class="filter-section">

    <button
    class="filter-btn active"
    data-category="all">

        All

    </button>

    <button
    class="filter-btn"
    data-category="bracelet">

        Bracelets

    </button>

    <button
    class="filter-btn"
    data-category="ring">

        Rings

    </button>

    <button
    class="filter-btn"
    data-category="necklace">

        Necklaces

    </button>

    <button
    class="filter-btn"
    data-category="earrings">

        Earrings

    </button>

    <button
    class="filter-btn"
    data-category="anklet">

        Anklets

    </button>

</section>

<!-- PRODUCTS GRID -->

<section class="products-section">

    <h2
    id="categoryTitle">

        All Products

    </h2>

    <div
    class="products-grid"
    id="productsGrid">

    </div>

</section>

<!-- PRODUCT POPUP -->

<div
class="popup-overlay hidden"
id="productPopup">

    <div class="product-popup">

        <!-- LEFT -->

        <div class="popup-left">

            <div class="main-image-container">

                <img
                id="mainPopupImage"
                src=""
                alt="Product">

            </div>

            <div
            class="thumbnail-strip"
            id="thumbnailStrip">

            </div>

            <div class="quantity-section">

                <button
                onclick="decreaseQty()">

                    -

                </button>

                <span id="quantityValue">

                    1

                </span>

                <button
                onclick="increaseQty()">

                    +

                </button>

            </div>

            <button
            class="cart-btn"
            onclick="addToCart()">

                Add To Cart

            </button>

        </div>

        <!-- RIGHT -->

        <div class="popup-right">

            <button
            class="close-popup"
            onclick="closePopup()">

                ×

            </button>

            <h2
            id="popupName">

            </h2>

            <p
            id="popupDescription">

            </p>

            <div class="price-box">

                <span
                class="actual-price"
                id="popupActualPrice">

                </span>

                <span
                class="offer-price"
                id="popupOfferPrice">

                </span>

            </div>

            <div class="stock-box">

                Available Stock:

                <span id="popupStock">

                </span>

            </div>

        </div>

    </div>

</div>

<!-- FOOTER -->

<footer>

    <div class="footer-content">

        <h3>Glimmer Jewelry</h3>

        <p>
            Timeless elegance crafted for you.
        </p>

    </div>

</footer>

<script src="js/products.js"></script>

</body>

</html>
